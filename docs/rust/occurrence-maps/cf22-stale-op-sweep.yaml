    foreign_files_left_untouched: >-
      compat/doctor.rs, compat/doctor/facts.rs, compat/doctor/render.rs,
      cf14_* tests, Workspace doctor/fold modules, root CLI/capabilities/errors,
      manifests/locks, docs accounting.

