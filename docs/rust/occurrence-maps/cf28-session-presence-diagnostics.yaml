      - occurrence: "RESEARCH_GAP_SENTINEL / research_gap"
        sites: 2
        where: crates/sk-install/src/tool_surface_diagnostics.rs
        posture: kept for the kinds that remain genuine gaps; session kinds dispatch to the new submodule before the generic sentinel check so the reference's own research-gap sentence is used
    import_paths:
      - occurrence: "crate::session::*"
        sites: 3
        where: crates/sk-install/src/{init.rs,migrations/completion_modern/presence.rs,lib.rs}
        posture: unchanged; the new items are additive and `pub mod session` already exists, so no lib.rs edit is requested
      - occurrence: "tool_surface_diagnostics::session_presence"
        sites: 0
