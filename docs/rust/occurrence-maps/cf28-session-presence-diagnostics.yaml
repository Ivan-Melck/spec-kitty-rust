# CF28 — occurrence classification (additive session-presence probes)
#
# Lane: NEW actual session-presence health probes (context_file / rule / hook).
#
# Shape history (no retroactive pre-edit approval is claimed):
#   * v1 (this lane's first draft) put the lane metadata inside `target:` and
#     laid the eight categories out as LISTS of rows. That shape fails the real
#     Source schema (`additionalProperties: false` on `target`, category
#     entries must be mappings with `action`) and the structural/admissibility
#     checks. The parent reported the failure; the original bytes are preserved
#     at /tmp/sk-evidence/cf28-20261105T215710Z-main/occurrence-map/
#     cf28-original-invalid.yaml (sha256 preserved in `status`).
#   * v2 (this file) keeps only schema-legal keys: `target` (term / operation /
#     replacement), the eight `categories` as mappings with `action`, and the
#     free-form `status:` block that the schema allows for exactly this kind of
#     lane metadata. Per-occurrence detail lives under `status.category_rows`.
#
# The change itself is ADDITIVE: no identifier, key, path, flag or message is
# renamed or removed. `target.term` therefore names the one literal whose
# *treatment* this lane changes: the research-gap sentinel `<unsupported>`,
# which stops being a blanket "no native diagnostic" verdict for the three
# session-presence kinds (the reference's own provider verdict replaces it) and
# stays in force for the kinds that remain genuine gaps
# (`plugin_manifest`, `native_config` outside Vibe, `agent_profile` without a
# manifest). `replacement` is null because no single literal replaces it.
#
# Standard 8 categories: each carries exactly one `action`; the detailed
# per-occurrence rows a reviewer needs are under `status.category_rows`.

target:
  term: "<unsupported>"
  operation: deprecate
  replacement: null

categories:
  code_symbols:
    action: manual_review
    note: >-
      Additive only: the private writer roster in session.rs gains a read-only
      public descriptor and the session-presence kinds gain a probe module. No
      symbol is renamed or removed; a reviewer confirms no second harness roster
      appeared.
  import_paths:
    action: manual_review
    note: >-
      One new submodule declaration (`tool_surface_diagnostics::session_presence`);
      every existing `crate::session::*` importer is unimported differently only
      where it already was.
  filesystem_paths:
    action: manual_review
    note: >-
      No new filesystem path literal: the probe reads the descriptor's existing
      harness paths and the existing CLAUDE_SETTINGS_REL.
  serialized_keys:
    action: manual_review
    note: >-
      Reuses the released state vocabulary and adds the reference's three
      session-presence finding codes; no JSON key is renamed.
  cli_commands:
    action: do_not_change
    note: >-
      `--kind context_file|rule|hook` tokens and the `--fix` refusal already
      exist; no command, flag or token value changes in this lane.
  user_facing_strings:
    action: manual_review
    note: >-
      New operator-facing messages are the reference's own sentences for the
      three kinds; existing install warnings are untouched.
  tests_fixtures:
    action: manual_review
    note: >-
      Two new cf28 test files; one owned unit test is retargeted because its
      premise is superseded (recorded below). No fixture bytes are rewritten.
  logs_telemetry:
    action: do_not_change
    note: >-
      No log, telemetry or warning-format change: the audit runs no writer and
      emits no install warning.

status:
  lane: cf28-session-presence-diagnostics
  change_kind: additive
  source_baseline: "9aed3a8012cb5eb22c0128b14d525039f95fea7a"
  inventory_receipt: "026-pre-edit-occurrence-inventory.Njlpmi.log"
  original_invalid_map:
    path: /tmp/sk-evidence/cf28-20261105T215710Z-main/occurrence-map/cf28-original-invalid.yaml
    sha256: "c65e9c207a3cf330f57359bc04a0bed9aa05809a7b99ef5740da5497153edd7a"
    size_bytes: 11502
    reported_by: parent (real Source schema failure)
    reproduced_by: "078-real-gate-reproduction-of-reported-failure (schema+structural+admissibility all invalid)"
  validation_receipts:
    real_gate_runner: /tmp/sk-evidence/cf28-20261105T215710Z-main/cf28-validate-map.py
    checks: [validate_against_schema, validate_occurrence_map, check_admissibility]
    note: >-
      Runs the pinned Source gate code itself on a temporary
      `occurrence_map.yaml` copy, so the verdict is the gate's, not a hand-rolled
      assertion.
  owned_paths:
    - crates/sk-install/src/session.rs
    - crates/sk-install/src/tool_surface_diagnostics.rs
    - crates/sk-install/src/tool_surface_diagnostics/session_presence.rs
