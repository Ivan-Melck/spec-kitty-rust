  rationale: >-
    This map classifies an additive change, so the per-category actions state
    what a reviewer must inspect (manual_review) or must not see change
    (do_not_change). The two do_not_change rows name surfaces this lane does not
    touch at all; every surface the diff actually edits is manual_review, so the
