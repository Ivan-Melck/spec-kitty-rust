    reason: Compact/non-bootstrap summary plumbing at the existing stage/read/catch/mark position only.
  - path: crates/sk-doctrine/tests/cf72_project_governance.rs
    action: manual_review
    reason: New focused policy tests including explicit empty/absent, deny, tools, template and retired cases.
  - path: crates/sk-cli/tests/cf72_compact_governance_cli.rs
