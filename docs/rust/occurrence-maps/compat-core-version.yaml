# Pre-edit canonical-authority unification, not a project version bump.
# Native Cargo0.1.0/pins/Source/historical receipts remain unchanged.
# Correct legacy-generated marker bytes to the Source compatibility target;
# existing CLI and modern effect values already equal4.0.0rc8.
target:
  term: COMPAT_CLI_VERSION
  replacement: COMPAT_CORE_VERSION
  operation: rename
categories:
  code_symbols: {action: manual_review}
  import_paths: {action: manual_review}
  filesystem_paths: {action: do_not_change}
  serialized_keys: {action: manual_review}
  cli_commands: {action: do_not_change}
  user_facing_strings: {action: manual_review}
  tests_fixtures: {action: manual_review}
  logs_telemetry: {action: do_not_change}
exceptions:
  - path: crates/sk-kernel/src/lib.rs
    action: manual_review
    reason: Define one lower-layer compatibility target constant; not Native package version.
  - path: crates/sk-install/src/lib.rs
    action: manual_review
    reason: Re-export the canonical constant for installation/report consumers.
  - path: crates/sk-cli/src/compat/mod.rs
    action: manual_review
    reason: Retain CORE_VERSION public name as an alias with unchanged Source value.
  - path: crates/sk-install/src/migrations/completion_modern.rs
    action: manual_review
    reason: Retain COMPAT_CLI_VERSION public name as an exact-value alias, no writer behavior change.
  - path: crates/sk-install/src/migrations/completion_legacy.rs
    action: manual_review
    reason: Use Source compatibility version for generated Source artifacts, not env Cargo0.1.0; NativeAPI alias retained.
  - path: docs/rust/reviews/**
    action: manual_review
    reason: New current disposition only; preserve immutable historical version/hash facts.
