  added_literals:
    - symbol: sk_doctrine::body::{GLOSSARY_PACK, GLOSSARY_TERM}
      where: crates/sk-doctrine/src/body.rs
      reason: >-
        `GlossaryPack.model_dump(by_alias=True, mode="json", exclude_none=True)` surface:
        `terms` is `Field(min_length=1)` (required, no default), `description` is optional,
        term list fields default to `None` (dropped), `confidence` is a lax `float`.
    - symbol: sk_doctrine::body::{PARADIGM, PARADIGM_REFERENCE}
      where: crates/sk-doctrine/src/body.rs
      reason: >-
        `Paradigm` surface: `directive_refs`/`references` are `default_factory=list`
        (always present), `ParadigmReference.type` is an `ArtifactKind` enum (JSON value =
        canonical spelling).
    - symbol: sk_doctrine::body::{PACK_SKILL, PACK_SKILL_PARAMETER, PACK_SKILL_INVOCATION, SKILL_EXPANSION}
      where: crates/sk-doctrine/src/body.rs
      reason: >-
        `PackSkill` surface: `tools` defaults to `["*"]`, `version` to `"1.0.0"`,
        `invocation` is `default_factory=SkillInvocation`, `parameters`/`triggers`/
        `maintainers` default empty, `body_path`/`expands_to`/`overrides`/`enhances`
        optional. `SkillInvocation`'s `mode="before"` validator forces
        `model_invocable=False` whenever `side_effects` is declared — the dump reflects
        that model value, not the authored field.
    - symbol: sk_doctrine::body::{MISSION_STEP_CONTRACT, MISSION_STEP_CONTRACT_STEP, MISSION_STEP_CONTRACT_INPUT, DELEGATES_TO, GATE_BINDING}
      where: crates/sk-doctrine/src/body.rs
      reason: >-
        `MissionStepContract` surface: `gates` defaults empty, `steps` is
        `Field(min_length=1)`, step `inputs` defaults empty, `optional`/`fail_open`
        default `False`/`True`, `handler_kind` defaults `"mission_step_contract"`,
        `DelegatesTo.candidates` is `Field(min_length=1)` and `kind` is an `ArtifactKind`.
    - symbol: sk_doctrine::offering::model::View::pack_skill
      where: crates/sk-doctrine/src/offering/model.rs
      reason: >-
        The `ArtifactKind::Skill` admission arm missing from the existing owner:
        `extra="forbid"` key set, `Literal["1.0"]`, id grammar/length, non-empty
        title/description, form discriminator with `body_path`/`expands_to` exclusivity,
        `expands_to` builtin/cli argv guards, duplicate-parameter, and
        `overrides`/`enhances` exclusivity/self-reference rules.
  reviewed_by: "CF31 implementer pre-edit classification (not independent approval)"
  accepted: false
