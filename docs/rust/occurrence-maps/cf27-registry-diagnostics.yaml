  - path: docs/rust/occurrence-maps/cf27-registry-diagnostics.yaml
    action: manual_review
    reason: >-
      This classification file; a NEW uniquely-named lane map, not a rewrite of
      another lane's map and not a posthoc replacement for one.

status:
  accepted: false
  phase: lane classification (authored after this lane's additive files, before parent wiring)
  host_mission_or_op: none (rewrite lane; not a host governance record)
  # `status` permits free-form keys in the occurrence-map schema; the lane's own
  # structural/admissibility record lives here rather than in an extra top-level
  # block (which the schema forbids: `additionalProperties: false`).
  validation:
    categories_present: 8
    every_category_has_explicit_action: true
    actions_used: [manual_review, do_not_change]
    operation: "omitted (additive: no rename, no removal of an existing identifier or wire key)"
    schema_check: >-
      Every emitted serialized key, status/enforcement/kind token, exit class and
      source-verbatim message above was read from the pinned Source
      (`src/specify_cli/compat/registry.py`, `src/specify_cli/compat/doctor.py`,
      `src/specify_cli/contracts/registry.py`, `src/specify_cli/contracts/anchoring.py`,
      `src/specify_cli/cli/commands/doctor.py`) and confirmed against the live
      oracle for 20 fixture cases; nothing was guessed.
    removals_check: >-
      No existing identifier, wire key, path or CLI flag is removed. The two
      parent-owned refusal arms and their codes are left in place for the parent
      to remove as part of wiring; this lane does not delete them.
    admissibility:
      no_fabricated_mission_metadata: true
      no_dependency_or_manifest_change: true
      no_source_pin_or_golden_change: true
      no_child_agents_or_commits: true
      foreign_files_left_untouched: >-
        compat/doctor.rs (beyond the one granted declaration), capabilities.rs,
        root CLI/errors, sk-doctrine/sk-charter/sk-mission owners,
        manifests/locks/SBOM, packs/pins/source/goldens, docs accounting.
