      `REFUSED_LEAVES` -> `IMPLEMENTED_LEAVES` move, the refusal-arm removal, the
      module-doc table row, the capability gap text and the inline refusal tests.
  - path: crates/sk-cli/src/compat/capabilities.rs
    action: manual_review
    reason: >-
      Parent-owned coverage arrays and gap text (they read `compat::doctor`'s leaf
