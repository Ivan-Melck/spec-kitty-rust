  import_paths:
    action: do_not_change
    notes: Existing charter ArtifactKind import reused, no second schema/parser/primitive.
  filesystem_paths:
    action: do_not_change
    notes: No read placement, writer, Source/packs/pins or dependencies changed.
  serialized_keys:
    action: do_not_change
    notes: Existing canonical kind values/JSON/default/null behavior unchanged.
  cli_commands:
    action: do_not_change
    notes: No new flags/root admission.
  user_facing_strings:
    action: do_not_change
    notes: Same Source repr spelling, generated from canonical kind metadata rather than a second roster.
  tests_fixtures:
    action: manual_review
    notes: Tiny actual Source member/phase observations and named Native model/consumer checks; no fabricated absent-new-API red.
  logs_telemetry:
    action: manual_review
    notes: Structural duplication and Source phase inspection not mislabeled as business red; retain producer broad library/report chronology slips.
exceptions:
