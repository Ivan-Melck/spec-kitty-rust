    reason: Source eagerly evaluates str(step) default before getattr title, unlike lazy profile or chain.
  - path: crates/sk-doctrine/src/offering/model.rs
    action: manual_review
    reason: Reuse the canonical EnumClass member set for ActorRole/Enforcement/StyleguideScope admission instead of separate literal rosters.
  - path: crates/sk-doctrine/src/body/model_view.rs
