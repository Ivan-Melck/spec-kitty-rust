# CF33 — PRE-edit occurrence classification (Kernel provable BOM decode + session phases)
#
# Lane: NEW CF33 functional work. ONE Kernel equivalent of
# `src/kernel/text_decode.py` (`decode_unambiguous`/`detect_bom`, plus the
# separate `normalize_newlines`) and a correction of the session-presence
# probes' decode/read *phases* so a Source-valid UTF-16/32 BOM settings file is
# present and a Source-escaping read/decode failure is not converted into an
# invented `unsafe`/`missing` health finding.
#
# This map is written BEFORE any code edit and is the standard-8 classification
# the lane's PRE-edit gate consumes. Counts come from the wrapped pre-edit
# inventory (`030-pre-edit-occurrence-inventory.8xiYDC.log`) against the pinned
# Source `9aed3a8012cb5eb22c0128b14d525039f95fea7a`.
#
# What `target.term` names: the literal whose *treatment* changes in this lane.
# The session read-only probe currently decodes orientation bytes with
# `sk_kernel::python_utf8::decode_utf8_sig` (UTF-8 / UTF-8-BOM only) and decodes
# `.claude/settings.json` the same way. The Source provider instead uses strict
# UTF-8 text mode for orientation (`read_text(encoding="utf-8")`) and
# `kernel.text_decode.decode_unambiguous` for settings. So this lane
# **deprecates the UTF-8-only decode step at those two session call sites** and
# replaces it with the Kernel provable decoder; `decode_utf8_sig` itself is NOT
# removed for its other callers (sk-workspace, Kernel's own codec tests).
#
# Not a rename mission: no CLI command, flag, wire key, state token or finding
# code is renamed. The two `do_not_change` categories are surfaces this lane
# leaves byte-identical; everything the diff edits is `manual_review` or
# `tests_fixtures`, so the review-time diff check flags review rows instead of
# pretending forbidden surfaces changed or silently whitelisting them.

target:
  term: "sk_kernel::python_utf8::decode_utf8_sig (session read-only probe decode)"
  operation: deprecate
  replacement: "sk_kernel::text_decode::decode_unambiguous / python_utf8::decode_utf8"

categories:
  code_symbols:
    action: manual_review
    note: >-
      Additive Kernel module plus one exact `pub mod text_decode;` declaration; the
      existing `OrientationSectionState::Undecodable` variant becomes a carrier of the
      CPython decode error, `ClaudeSettingsShape` read failures are separated from
      decode failures, `probe()` becomes fallible and `audit_tool_surfaces` gains a
      local typed failure. No symbol is deleted for another consumer.
  import_paths:
    action: manual_review
    note: >-
      `pub mod text_decode` is declared once in the Kernel lib.rs; session.rs imports
      `sk_kernel::text_decode` and `sk_kernel::read_source_bytes`; the diagnostics
      module imports the new local failure type. No path attribute, no re-export
      wrapper, no second decoder module.
  filesystem_paths:
    action: manual_review
    note: >-
      No new path literal: the probe keeps using the one writer roster's
      `.claude/CLAUDE.md`, `AGENTS.md`, … and the existing `CLAUDE_SETTINGS_REL`.
      Only the *read policy* on those paths changes to Source's own
      (`read_text` / `read_bytes` follow the path, unbounded).
  serialized_keys:
    action: do_not_change
    note: >-
      The released `doctor tool-surfaces` JSON, the state vocabulary
      (present/missing/stale/unsafe/not_applicable), the finding codes and the
      summary counters are untouched. Source-valid UTF-16/32-BOM settings now
      *reach* the existing `present` state; the escape path emits no document at
      all, exactly like the reference raising out of the command.
  cli_commands:
    action: do_not_change
    note: >-
      `doctor tool-surfaces --kind context_file|rule|hook`, `--tool`, `--json` and
      the `--fix` refusal keep their tokens, exit contract and wording. The escape
      reuses the command's existing non-zero (exit 1) domain-error path; no flag,
      code or capability registration is added.
  user_facing_strings:
    action: manual_review
    note: >-
      Existing finding sentences are unchanged. The one new operator-visible text is
      the propagated failure line for a session decode/read escape (Source emits a
      Python traceback there; this lane emits the same CPython/OS message plus the
      path, and the traceback/wire difference is recorded as debt).
  tests_fixtures:
    action: manual_review
    note: >-
      New `cf33_*` Kernel/Install/CLI test targets on fresh tempfile fixtures. One
      CF28 assertion whose premise CF33 corrects (a non-UTF-8 context file reported
      as `unsafe`) is retargeted to the escaping failure it really is; it is not
      deleted or weakened to green.
  logs_telemetry:
    action: do_not_change
    note: >-
      No log, metric or install-warning format change. The audit still runs no
      writer, creates nothing and locks nothing.

